note: >-
  ChannelEngine publishes first-party OpenAPI-generated API clients for the
  Merchant API and Channel API across seven languages via its GitHub org. As of
  2024 these pre-generated clients are deprecated/archived; ChannelEngine now
  recommends generating your own client from the OpenAPI specification with
  OpenAPI Generator. They remain first-party and usable. Platform e-commerce
  connectors (Magento 2 / Adobe Commerce, WooCommerce) are also first-party.
