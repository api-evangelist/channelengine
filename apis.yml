apis:
- name: ChannelEngine Merchant API
  description: >-
    Integrate the system of your choice (ERP, PIM, WMS, or webstore) with
    ChannelEngine. Synchronize product content and offers; retrieve, acknowledge
    and update orders, shipments, returns, cancellations and stock; manage
    product bundles, competition prices, listed products, stock locations and
    webhooks. API-key authenticated, JSON envelope responses, page-based
    pagination (max 100 per page), header-based rate limiting.
  humanURL: https://support.channelengine.com/hc/en-us/sections/4406511272733-Merchant-API
  baseURL: https://demo.channelengine.net/api/v2/
  properties:
  - type: Documentation
    url: https://support.channelengine.com/hc/en-us/sections/4406511272733-Merchant-API
  - type: GettingStarted
    url: https://support.channelengine.com/hc/en-us/articles/10023835402397-Merchant-API-getting-started
  - type: RateLimits
    url: https://support.channelengine.com/hc/en-us/articles/10027638693405-Merchant-API-rate-limiting
- name: ChannelEngine Channel API
  description: >-
    Set up your own marketplace on ChannelEngine with automated connections
    between your marketplace and partnering merchants. Synchronize product data
    and offer changes, create and invoice orders, and handle shipments,
    cancellations and returns between channel and merchant.
  humanURL: https://support.channelengine.com/hc/en-us/sections/4406503369629-Channel-API
  baseURL: https://demo.channelengine.net/api/v2/
  properties:
  - type: Documentation
    url: https://support.channelengine.com/hc/en-us/articles/4409485647133-Channel-API-main-resources
- name: ChannelEngine Channel Management API
  description: >-
    Export the categories and product data attributes of your marketplace to
    ChannelEngine via a unified approach, so merchants can map and list against
    your channel's taxonomy.
  humanURL: https://support.channelengine.com/hc/en-us/articles/4409485647901-ChannelEngine-connect-to-the-Channel-Management-API
  baseURL: https://demo.channelengine.net/api/v2/
  properties:
  - type: Documentation
    url: https://support.channelengine.com/hc/en-us/articles/4409485647901-ChannelEngine-connect-to-the-Channel-Management-API
