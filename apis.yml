aid: channelengine
name: ChannelEngine
description: >-
  ChannelEngine is a marketplace integration and multichannel e-commerce
  platform, founded in Leiden, Netherlands and backed by General Catalyst, that
  lets brands, retailers, and manufacturers connect their ERP, PIM, WMS, or
  webstore once and sell across 1,300+ global marketplaces, social platforms,
  and emerging AI commerce channels. It centralizes product listing, inventory
  and offer synchronization, order and fulfillment management, returns, and
  dynamic repricing from a single dashboard, and exposes three REST APIs: the
  Merchant API (integrate your own systems with ChannelEngine), the Channel API
  (build your own marketplace on ChannelEngine), and the Channel Management API
  (export marketplace categories and product attributes). The APIs use API-key
  authentication, JSON response envelopes, page-based pagination, header-based
  rate limiting, and webhooks for near-real-time events.
